<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ede0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1813" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>型道場</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">
  <!-- 一覧 -->
  <section id="home" class="screen">
    <header class="home-head">
      <h1>型道場</h1>
      <p class="lead">囲いと戦法の「型」を、自分で駒を動かして覚える</p>
      <div class="overall" id="overall"></div>
    </header>
    <div id="lesson-list"></div>
  </section>

  <!-- 練習 -->
  <section id="lesson" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="back" aria-label="一覧へ戻る">‹</button>
      <div class="topbar-title">
        <span id="lesson-title"></span>
        <span class="tag" id="lesson-tag"></span>
      </div>
      <div class="seg" role="tablist">
        <button role="tab" data-mode="practice" class="on">練習</button>
        <button role="tab" data-mode="demo">お手本</button>
      </div>
    </header>

    <div class="play">
      <div class="hand hand-gote" id="hand-gote"></div>
      <div class="board-wrap">
        <div class="files" id="files"></div>
        <div class="board-row">
          <div class="board" id="board"></div>
          <div class="ranks" id="ranks"></div>
        </div>
      </div>
      <div class="hand hand-sente" id="hand-sente"></div>
    </div>

    <div class="status-row">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text"></span>
    </div>

    <div class="card msg" id="msg"></div>

    <div class="actions" id="practice-actions">
      <button class="btn" id="btn-hint">ヒント</button>
      <button class="btn" id="btn-undo">1手戻す</button>
      <button class="btn" id="btn-reset">最初から</button>
      <button class="btn toggle" id="btn-ghost" hidden>完成図</button>
    </div>
    <div class="actions" id="demo-actions" hidden>
      <button class="btn" id="demo-first" aria-label="最初へ">⏮</button>
      <button class="btn wide" id="demo-prev">◀ 戻る</button>
      <button class="btn wide primary" id="demo-next">進む ▶</button>
    </div>
    <div class="variations" id="demo-variations" hidden></div>
  </section>

  <!-- 成り選択 -->
  <div class="overlay" id="promo" hidden>
    <div class="sheet small">
      <p class="sheet-title">成りますか？</p>
      <div class="promo-choices">
        <button class="promo-btn" id="promo-yes"></button>
        <button class="promo-btn" id="promo-no"></button>
      </div>
    </div>
  </div>

  <!-- クリア -->
  <div class="overlay" id="done" hidden>
    <div class="sheet">
      <p class="done-badge" id="done-badge"></p>
      <h2 id="done-title"></h2>
      <p id="done-text"></p>
      <p class="done-score" id="done-score"></p>
      <ul class="var-list" id="done-vars"></ul>
      <div class="sheet-actions" id="done-actions"></div>
    </div>
  </div>
</div>
<script src="engine.js?v=1"></script>
<script src="lessons.js?v=1"></script>
<script src="trainer.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
